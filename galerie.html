            <div class="brand">

                    href="index.html"
                    class="brand-link"
                    aria-label="Zur Startseite"

            </div>

            <nav class="main-nav" aria-label="Hauptnavigation">

            </nav>

            <div class="nav-dropdown">

                <button
                    class="nav-dropbtn"
                    type="button"
                    aria-expanded="false"
                    aria-controls="nav-dropdown-menu"
                    aria-label="Menü öffnen"
                >
                    <span class="nav-hamburger" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>

                <nav
                    class="nav-dropdown-menu"
                    id="nav-dropdown-menu"
                    aria-label="Mobile Navigation"
                >
                    <a href="index.html">Home</a>

                    <a
                        href="galerie.html"
                        class="active"
                        aria-current="page"
                    >
                        Galerie
                    </a>

                    <a href="angebote.html">Angebote</a>
                    <a href="kontakt.html">Kontakt</a>
                    <a href="ueber-mich.html">Über mich</a>
                </nav>

            </div>

            <div class="header-action">

                <a
                    class="whatsapp-link"
                    href="https://wa.me/41782228992"
                    target="_blank"
                    rel="noreferrer noopener"
                    aria-label="WhatsApp-Nachricht senden"
                >
                    <img
                        src="Bilder/Whatsapp_Logo.png"
                        alt="WhatsApp"
                    >
                </a>

                <a
                    class="social-link"
                    href="https://www.instagram.com/nailsbyamanda.ch/"
                    target="_blank"
                    rel="noreferrer noopener"
                    aria-label="Instagram-Profil öffnen"
                >
                    <img
                        src="Bilder/Instagram_Logo.png"
                        alt="Instagram"
                    >
                </a>

            </div>

        </div>
    </header>

    <main class="gallery-modern-page">

        <section class="gallery-modern-hero">
            <div class="container gallery-modern-hero-inner">

                <p class="gallery-modern-label">Galerie</p>

                <h1>
                    Inspiration für dein nächstes Naildesign.
                </h1>

                <p class="gallery-modern-intro">
                    Entdecke verschiedene Formen, Farben und Designs aus
                    meinem Studio.
                </p>

            </div>
        </section>

        <section class="gallery-modern-section">
            <div class="container">

                <div class="gallery-modern-grid">

                    <!-- Bild 1 -->
                    <figure class="gallery-modern-item">
                        <img
                            src="Bilder/Nails_1_Format54.PNG"
                            alt="French Nails Almond"
                            loading="eager"
                        >

                        <figcaption>
                            French Nails Almond
                        </figcaption>
                    </figure>

                    <!-- Bild 2 -->
                    <figure class="gallery-modern-item">
                        <img
                            src="Bilder/Nails_2_Format54.jpg"
                            alt="French Nails Square"
                            loading="lazy"
                        >

                        <figcaption>
                            French Nails Square
                        </figcaption>
                    </figure>

                    <!-- Bild 3 -->
                    <figure class="gallery-modern-item">
                        <img
                            src="Bilder/Nails_3_Format54.jpg"
                            alt="Summer Nails"
                            loading="lazy"
                        >

                        <figcaption>
                            Summer Nails
                        </figcaption>
                    </figure>

                    <!-- Bild 8 -->
                    <figure class="gallery-modern-item">
                        <img
                            src="Bilder/Nails_8_Format54.jpg"
                            alt="Summer Nails Türkis"
                            loading="lazy"
                        >

                        <figcaption>
                            Summer Nails Türkis
                        </figcaption>
                    </figure>

                    <!-- Bild 9 -->
                    <figure class="gallery-modern-item">
                        <img
                            src="Bilder/Nails_9_Format54.jpg"
                            alt="Zebra French Almond"
                            loading="lazy"
                        >

                        <figcaption>
                            Zebra French Almond
                        </figcaption>
                    </figure>

                    <!-- Bild 10 -->
                    <figure class="gallery-modern-item">
                        <img
                            src="Bilder/Nails_10_Format54.jpg"
                            alt="Summer Nails"
                            loading="lazy"
                        >

                        <figcaption>
                            Summer Nails
                        </figcaption>
                    </figure>

                    <!-- Bild 7 -->
                    <figure class="gallery-modern-item">
                        <img
                            src="Bilder/Nails_7_Format54.png"
                            alt="Neutral Nails Almond"
                            loading="lazy"
                        >

                        <figcaption>
                            Neutral Nails Almond
                        </figcaption>
                    </figure>

                    <!-- Bild 4 ohne Text -->
                    <figure class="gallery-modern-item gallery-modern-item--without-text">
                        <img
                            src="Bilder/Nails_4_Format54.jpg"
                            alt="Naildesign"
                            loading="lazy"
                        >
                    </figure>

                    <!-- Bild 5 ohne Text -->
                    <figure class="gallery-modern-item gallery-modern-item--without-text">
                        <img
                            src="Bilder/Nails_5_Format54.PNG"
                            alt="Naildesign"
                            loading="lazy"
                        >
                    </figure>

                    <!-- Bild 6 ohne Text -->
                    <figure class="gallery-modern-item gallery-modern-item--without-text">
                        <img
                            src="Bilder/Nails_6_Format54.JPG"
                            alt="Naildesign"
                            loading="lazy"
                        >
                    </figure>

                </div>

            </div>
        </section>
